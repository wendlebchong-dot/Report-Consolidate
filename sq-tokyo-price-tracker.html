<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQ to Tokyo – Fare Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#0E1B3D;--mute:#5d6987;--line:#d9deea;--navy:#0E1B3D;--gold:#B8862B;--sakura:#D9738F;--good:#1f8a5b;--bad:#c4452f;
--serif:"Instrument Serif",Georgia,serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1226;--card:#121C38;--ink:#EDF0F8;--mute:#93a0c0;--line:#25315a;--navy:#060c1d;--gold:#E3B654;--sakura:#F08FAA;--good:#46c58b;--bad:#ff7b62}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
h1,h2{margin:0;font-weight:400}
.top{background:var(--navy);color:#EDF0F8;border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--sakura);opacity:.9}
.route{font-family:var(--serif);font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.01em;position:relative;z-index:1}
.route span{color:var(--gold)}
.sub{margin-top:8px;color:#aab5d3;font-size:14px;position:relative;z-index:1}
.price{text-align:right;position:relative;z-index:1}
.price .n{font-family:var(--serif);font-size:clamp(44px,8vw,76px);line-height:1;color:#fff}
.price .l{font-size:13px;color:#fff;opacity:.85}
.signal{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.signal b{font-weight:700}
.grid{display:grid;gap:14px;margin-top:14px}
.stats{grid-template-columns:repeat(4,1fr)}
.main{grid-template-columns:1fr 300px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .k{font-size:13px;color:var(--mute)}
.stat .v{font-family:var(--serif);font-size:32px;line-height:1.2}
.stat .d{font-size:13px;color:var(--mute)}
.up{color:var(--bad)}.down{color:var(--good)}
h2{font-family:var(--serif);font-size:24px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:500}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) button.pri{background:var(--gold);color:#0A1226}}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.pri{width:100%;margin-top:14px}
:focus-visible{outline:2px solid var(--sakura);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chartbox{position:relative}
svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;display:none;white-space:nowrap;transform:translate(-50%,-120%)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.tablewrap{overflow-x:auto;max-height:300px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;position:sticky;top:0;background:var(--card)}
td button{padding:3px 8px;font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr}.top{grid-template-columns:1fr}.price{text-align:left}.top:after{opacity:.5}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="route" id="routeTitle">SIN <span>→</span> HND</div>
      <div class="sub" id="routeSub"></div>
    </div>
    <div class="price"><div class="n" id="curPrice">–</div><div class="l" id="curLabel">Latest fare, SGD</div></div>
  </header>

  <div class="signal" id="signal" role="status"><span class="dot" id="sigDot"></span><div id="sigText">Add a fare to see a signal.</div></div>

  <section class="grid stats" id="stats"></section>

  <section class="grid main">
    <div class="card">
      <h2>Price history</h2>
      <div class="chartbox" id="chartbox"><svg id="chart" viewBox="0 0 700 300" role="img" aria-label="Fare price history chart"></svg><div class="tip" id="tip"></div></div>
      <div class="legend"><span><i style="border-color:var(--sakura)"></i>Fare</span><span><i style="border-color:var(--gold);border-top-style:dashed"></i>Your target</span></div>
      <h2 style="margin-top:20px">Log</h2>
      <div class="tablewrap"><table><thead><tr><th>Date</th><th>Fare (SGD)</th><th>Change</th><th>Note</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="tools">
        <button class="ghost" id="csv">Export CSV</button>
        <button class="ghost" id="sample">Load sample data</button>
        <button class="ghost" id="clear">Clear all</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Add a fare</h2>
        <div class="row2">
          <div><label for="fPrice">Fare (SGD)</label><input id="fPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 780"></div>
          <div><label for="fDate">Checked on</label><input id="fDate" type="date"></div>
        </div>
        <label for="fNote">Note (optional)</label><input id="fNote" placeholder="e.g. SQ site, promo fare">
        <button class="pri" id="add">Add fare</button>
        <div class="note">Prices are entered by you. This file doesn't fetch live fares.</div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Trip settings</h2>
        <label for="sRoute">Route</label>
        <select id="sRoute"><option value="HND">Singapore → Tokyo Haneda (HND)</option><option value="NRT">Singapore → Tokyo Narita (NRT)</option></select>
        <div class="row2">
          <div><label for="sFlight">Flight</label><input id="sFlight" placeholder="SQ638"></div>
          <div><label for="sCabin">Cabin</label><select id="sCabin"><option>Economy</option><option>Premium Economy</option><option>Business</option><option>First / Suites</option></select></div>
        </div>
        <div class="row2">
          <div><label for="sDepart">Departure</label><input id="sDepart" type="date"></div>
          <div><label for="sTarget">Target (SGD)</label><input id="sTarget" type="number" min="0" step="1" inputmode="numeric"></div>
        </div>
        <label for="sTrip">Trip type</label>
        <select id="sTrip"><option>Return</option><option>One-way</option></select>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
const KEY="sq-tokyo-tracker-v1";
const $=id=>document.getElementById(id);
const fmt=n=>"S$"+Math.round(n).toLocaleString("en-SG");
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=s=>new Date(s+"T00:00:00").toLocaleDateString("en-SG",{day:"numeric",month:"short"});
let state={fares:[],settings:{route:"HND",flight:"SQ638",cabin:"Economy",trip:"Return",depart:"",target:700}};

function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.fares)state=Object.assign(state,s)}}catch(e){}
  if(!state.fares.length&&!localStorage.getItem(KEY+"-seen")){seed();try{localStorage.setItem(KEY+"-seen","1")}catch(e){}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function seed(){
  const out=[];let p=820;
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    p+=Math.round(Math.sin(i*1.7)*28+Math.cos(i*0.6)*14-3);
    p=Math.max(610,p);
    out.push({id:Math.random().toString(36).slice(2),date:d.toISOString().slice(0,10),price:p,note:i===29?"Sample data":""});
  }
  state.fares=out;
  if(!state.settings.depart){const d=new Date();d.setDate(d.getDate()+75);state.settings.depart=d.toISOString().slice(0,10)}
}
function sorted(){return state.fares.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}

function renderHeader(){
  const s=state.settings;
  $("routeTitle").innerHTML="SIN <span>→</span> "+s.route;
  const dep=s.depart?new Date(s.depart+"T00:00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):"date not set";
  const days=s.depart?Math.ceil((new Date(s.depart+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5):null;
  $("routeSub").textContent=[s.flight||"SQ",s.cabin,s.trip,"departs "+dep+(days!==null&&days>=0?" ("+days+" days away)":"")].join(", ");
}
function renderStats(f){
  const el=$("stats");
  if(!f.length){el.innerHTML='<div class="card stat" style="grid-column:1/-1"><div class="k">No fares yet</div><div class="d">Add the first fare you see on singaporeair.com to start tracking.</div></div>';return}
  const ps=f.map(x=>x.price),cur=ps[ps.length-1];
  const min=Math.min(...ps),max=Math.max(...ps),avg=ps.reduce((a,b)=>a+b,0)/ps.length;
  const minD=f[ps.indexOf(min)].date,maxD=f[ps.indexOf(max)].date;
  const wk=f.length>7?cur-ps[ps.length-8]:(f.length>1?cur-ps[0]:0);
  const cls=wk>0?"up":wk<0?"down":"";
  const sign=wk>0?"+":wk<0?"−":"";
  el.innerHTML=
   `<div class="card stat"><div class="k">Lowest seen</div><div class="v">${fmt(min)}</div><div class="d">${dfmt(minD)}</div></div>`+
   `<div class="card stat"><div class="k">Highest seen</div><div class="v">${fmt(max)}</div><div class="d">${dfmt(maxD)}</div></div>`+
   `<div class="card stat"><div class="k">Average</div><div class="v">${fmt(avg)}</div><div class="d">${f.length} checks</div></div>`+
   `<div class="card stat"><div class="k">Past 7 checks</div><div class="v ${cls}">${sign}${fmt(Math.abs(wk))}</div><div class="d">${wk>0?"Fare rising":wk<0?"Fare falling":"Flat"}</div></div>`;
}
function renderSignal(f){
  const dot=$("sigDot"),txt=$("sigText");
  if(!f.length){$("curPrice").textContent="–";dot.style.background="var(--mute)";txt.textContent="Add a fare to see a signal.";return}
  const ps=f.map(x=>x.price),cur=ps[ps.length-1],min=Math.min(...ps),t=+state.settings.target||0;
  $("curPrice").textContent=fmt(cur);
  $("curLabel").textContent="Latest fare, SGD, "+dfmt(f[f.length-1].date);
  const rising=f.length>=4&&ps[ps.length-1]>ps[ps.length-4];
  let c,m;
  if(t&&cur<=t){c="var(--good)";m=`<b>Book now.</b> ${fmt(cur)} is ${fmt(t-cur)} under your target of ${fmt(t)}.`}
  else if(f.length>3&&cur<=min*1.03){c="var(--good)";m=`<b>Near the lowest fare you've seen</b> (${fmt(min)}).${t?` Still ${fmt(cur-t)} above your target.`:""}`}
  else if(rising){c="var(--bad)";m=`<b>Fares are climbing.</b> ${t?`${fmt(cur-t)} above target. `:""}If your dates are fixed, consider booking soon.`}
  else{c="var(--gold)";m=`<b>Keep watching.</b> ${t?`${fmt(cur-t)} above your target of ${fmt(t)}.`:"Set a target price to get a book signal."}`}
  dot.style.background=c;txt.innerHTML=m;
}
function renderRows(f){
  const body=$("rows");
  if(!f.length){body.innerHTML='<tr><td colspan="5" style="color:var(--mute)">No fares logged.</td></tr>';return}
  body.innerHTML=f.slice().reverse().map((x,i,arr)=>{
    const prev=arr[i+1];let ch="";
    if(prev){const d=x.price-prev.price;ch=d===0?"–":`<span class="${d>0?"up":"down"}">${d>0?"+":"−"}${fmt(Math.abs(d))}</span>`}
    return `<tr><td>${dfmt(x.date)}</td><td>${fmt(x.price)}</td><td>${ch}</td><td>${esc(x.note||"")}</td><td><button class="ghost" data-del="${x.id}" aria-label="Delete fare from ${x.date}">Delete</button></td></tr>`}).join("");
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderChart(f){
  const svg=$("chart"),W=700,H=300,L=52,R=16,T=14,B=30;
  if(f.length<2){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--mute)" font-size="14">Log at least two fares to see the trend.</text>`;return}
  const t=+state.settings.target||null;
  const ps=f.map(x=>x.price);
  let lo=Math.min(...ps,t||Infinity),hi=Math.max(...ps,t||-Infinity);
  const pad=(hi-lo||50)*.12;lo=Math.floor((lo-pad)/10)*10;hi=Math.ceil((hi+pad)/10)*10;
  const X=i=>L+i*(W-L-R)/(f.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let g="";
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v)}</text>`}
  const step=Math.max(1,Math.ceil(f.length/6));
  f.forEach((x,i)=>{if(i%step===0||i===f.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${dfmt(x.date)}</text>`});
  const pts=f.map((x,i)=>`${X(i)},${Y(x.price)}`).join(" ");
  const area=`${L},${H-B} ${pts} ${X(f.length-1)},${H-B}`;
  if(t)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 5"/>`;
  g+=`<polygon points="${area}" fill="var(--sakura)" opacity=".13"/><polyline points="${pts}" fill="none" stroke="var(--sakura)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const mi=ps.indexOf(Math.min(...ps));
  g+=`<circle cx="${X(mi)}" cy="${Y(ps[mi])}" r="5" fill="var(--good)"/>`;
  g+=`<circle cx="${X(f.length-1)}" cy="${Y(ps[ps.length-1])}" r="5" fill="var(--sakura)"/>`;
  g+=`<line id="hl" y1="${T}" y2="${H-B}" stroke="var(--mute)" opacity="0" /><rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
  svg.innerHTML=g;
  const hit=$("hit"),tip=$("tip"),hl=$("hl");
  hit.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(f.length-1,Math.round((px-L)/((W-L-R)/(f.length-1)))));
    hl.setAttribute("x1",X(i));hl.setAttribute("x2",X(i));hl.setAttribute("opacity",".5");
    tip.style.display="block";tip.style.left=(X(i)*r.width/W)+"px";tip.style.top=(Y(f[i].price)*r.height/H)+"px";
    tip.textContent=dfmt(f[i].date)+": "+fmt(f[i].price);
  });
  hit.addEventListener("pointerleave",()=>{tip.style.display="none";hl.setAttribute("opacity","0")});
}
function renderAll(){const f=sorted();renderHeader();renderStats(f);renderSignal(f);renderChart(f);renderRows(f)}

function bindSettings(){
  const s=state.settings,map={sRoute:"route",sFlight:"flight",sCabin:"cabin",sDepart:"depart",sTarget:"target",sTrip:"trip"};
  Object.keys(map).forEach(id=>{
    $(id).value=s[map[id]]||"";
    $(id).addEventListener("input",()=>{
      state.settings[map[id]]=id==="sTarget"?(+$(id).value||0):$(id).value;
      if(id==="sRoute"&&!["SQ638","SQ634","SQ12","SQ11",""].every(v=>v!==state.settings.flight)){}
      save();renderAll();
    });
  });
}
$("add").addEventListener("click",()=>{
  const p=+$("fPrice").value;
  if(!p||p<=0){$("fPrice").focus();return}
  state.fares.push({id:Math.random().toString(36).slice(2),date:$("fDate").value||today(),price:p,note:$("fNote").value.trim()});
  $("fPrice").value="";$("fNote").value="";save();renderAll();$("fPrice").focus();
});
$("fPrice").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("rows").addEventListener("click",e=>{const id=e.target.getAttribute&&e.target.getAttribute("data-del");if(id){state.fares=state.fares.filter(x=>x.id!==id);save();renderAll()}});
$("sample").addEventListener("click",()=>{if(!state.fares.length||confirm("Replace your log with sample data?")){seed();save();renderAll()}});
$("clear").addEventListener("click",()=>{if(confirm("Delete all logged fares?")){state.fares=[];save();renderAll()}});
$("csv").addEventListener("click",()=>{
  const rows=[["date","fare_sgd","note"]].concat(sorted().map(x=>[x.date,x.price,'"'+(x.note||"").replace(/"/g,'""')+'"']));
  const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sq-tokyo-fares.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$("fDate").value=today();
load();bindSettings();renderAll();save();
})();
</script>
</body>
</html>
